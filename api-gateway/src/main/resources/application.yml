server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: partner-course-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/public/courses,/api/public/courses/**
                - Method=GET
              filters:
                - RewritePath=/api/public/(?<segment>.*), /${segment}
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/auth/(?<segment>.*), /auth/${segment}
            - id: auth-service-api-keys
              uri: http://localhost:8081
              predicates:
                - Path=/api/api-keys,/api/api-keys/**
              filters:
                - StripPrefix=1
            - id: course-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/courses/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
            - id: registration-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/registrations/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - http://localhost:5173
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - '*'
                allowCredentials: true
auth-service:
  base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
